services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-planning-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_planning}
      POSTGRES_USER: ${POSTGRES_USER:-ai_planning}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_planning_local}
    ports:
      - "5432:5432"
    volumes:
      - ai-planning-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_planning} -d ${POSTGRES_DB:-ai_planning}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: ai-planning-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ai-planning-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ai-planning-postgres-data:
  ai-planning-redis-data:
