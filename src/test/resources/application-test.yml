spring:
  datasource:
    url: jdbc:h2:mem:ai_planning;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate

app:
  security:
    jwt:
      issuer: ai-planning-backend-test
      secret: test-secret-that-is-longer-than-thirty-two-characters
      expiration: PT15M
    session:
      absolute-expiration: P14D
      refresh-lock-duration: PT10S
      refresh-cookie-name: refresh_token
      refresh-cookie-path: /api/v1/auth
      refresh-cookie-secure: false
      refresh-cookie-same-site: Strict
      redis-enabled: false
    login-attempts:
      max-attempts: 3
      block-duration: PT15M
  cors:
    allowed-origins:
      - http://localhost:5173
  bootstrap:
    admin:
      enabled: true
      email: admin@aiplanning.local
      password: Admin@123
