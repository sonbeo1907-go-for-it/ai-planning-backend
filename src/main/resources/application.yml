spring:
  application:
    name: ai-planning-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}
      repositories:
        enabled: false
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

app:
  security:
    jwt:
      issuer: ai-planning-backend
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:PT15M}
    session:
      absolute-expiration: ${AUTH_SESSION_EXPIRATION:P14D}
      refresh-lock-duration: ${REFRESH_LOCK_DURATION:PT10S}
      refresh-cookie-name: ${REFRESH_COOKIE_NAME:refresh_token}
      refresh-cookie-path: /api/v1/auth
      refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
      refresh-cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
      redis-enabled: ${AUTH_REDIS_ENABLED:true}
    login-attempts:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      block-duration: ${LOGIN_BLOCK_DURATION:PT15M}
    google:
      enabled: ${GOOGLE_AUTH_ENABLED:false}
      client-id: ${GOOGLE_CLIENT_ID:}
      issuer: https://accounts.google.com
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  bootstrap:
    admin:
      enabled: false
      username: admin
      email: admin@aiplanning.local
      password: disabled-bootstrap-password
      full-name: System Administrator

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
